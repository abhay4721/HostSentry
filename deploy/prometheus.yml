global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: hostsentry-central
    scheme: https
    metrics_path: /metrics
    static_configs:
      - targets: [backend:8443]
    tls_config:
      ca_file: /etc/hostsentry/pki/ca.crt
      server_name: backend
    authorization:
      type: Bearer
      credentials_file: /etc/hostsentry/pki/prometheus.token
