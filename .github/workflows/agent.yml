name: Linux agent

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Format, vet, and unit tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hostsentry
          POSTGRES_PASSWORD: hostsentry-test-password
          POSTGRES_DB: hostsentry_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hostsentry -d hostsentry_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      HOSTSENTRY_TEST_DATABASE_URL: postgres://hostsentry:hostsentry-test-password@127.0.0.1:5432/hostsentry_test?sslmode=disable
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Download modules
        run: go mod download
      - name: Format
        run: make fmt
      - name: Vet
        run: go vet ./...
      - name: Unit tests
        run: go test ./...

  agent:
    name: Test and build (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download and verify modules
        run: go mod download

      - name: Vet
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: go vet ./...

      - name: Build Linux agent
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: go build -trimpath -o hostsentry-agent ./cmd/hostsentry-agent
      - name: Build Linux central server
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: go build -trimpath -o hostsentry-server ./cmd/hostsentry-server

  frontend:
    name: Dashboard build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Lint dashboard
        run: npm --prefix frontend run lint
      - name: Test dashboard
        run: npm --prefix frontend test
      - name: Install Chromium for browser tests
        run: npx --prefix frontend playwright install --with-deps chromium
      - name: Test dashboard in Chromium
        run: npm --prefix frontend run test:e2e
      - name: Build dashboard
        run: npm --prefix frontend run build
